name: Windows build

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Download ASIO SDK (Steinberg)
        id: asio
        shell: pwsh
        continue-on-error: true
        run: |
          Invoke-WebRequest -Uri "https://www.steinberg.net/asiosdk" -OutFile asiosdk.zip -UserAgent "Mozilla/5.0"
          Expand-Archive asiosdk.zip -DestinationPath asiosdk
          $common = Get-ChildItem -Path asiosdk -Recurse -Directory -Filter common | Select-Object -First 1
          if ($null -eq $common) { throw "ASIO SDK: folder 'common' not found" }
          "ASIO_SDK_DIR=$($common.FullName)" | Out-File -FilePath $env:GITHUB_ENV -Append
          Write-Host "ASIO SDK: $($common.FullName)"

      - name: Download fonts (Barlow Condensed, Yellowtail)
        shell: pwsh
        continue-on-error: true
        run: |
          New-Item -ItemType Directory -Force -Path Resources/fonts | Out-Null
          $base = "https://raw.githubusercontent.com/google/fonts/main"
          $files = @("ofl/barlowcondensed/BarlowCondensed-Medium.ttf", "ofl/barlowcondensed/BarlowCondensed-SemiBold.ttf", "ofl/barlowcondensed/BarlowCondensed-Bold.ttf", "apache/yellowtail/Yellowtail-Regular.ttf")
          foreach ($f in $files) { Invoke-WebRequest -Uri "$base/$f" -OutFile ("Resources/fonts/" + (Split-Path $f -Leaf)) }
          Get-ChildItem Resources/fonts

      - name: Configure
        shell: pwsh
        run: |
          $asio = $env:ASIO_SDK_DIR
          if ($asio) { Write-Host "Building with ASIO" } else { Write-Host "Building WITHOUT ASIO (SDK download failed)" }
          cmake -B build -A x64 -DASIO_SDK_DIR="$asio"

      - name: Build
        run: cmake --build build --config Release --parallel

      - name: Upload executable
        uses: actions/upload-artifact@v4
        with:
          name: Wheelhouse-win64
          path: build/Wheelhouse_artefacts/Release/*.exe
          if-no-files-found: error

      - name: Upload VST3
        uses: actions/upload-artifact@v4
        with:
          name: Wheelhouse-VST3-win64
          path: build/WheelhousePlugin_artefacts/Release/VST3/
          if-no-files-found: error
