<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Wheelhouse</title>
<style>
/*STYLE*/
</style>
</head>
<body>
<div id="tip" role="tooltip"></div>
<div id="stage">

  <!-- ============ Header bar ============ -->
  <header class="top">
    <div class="logo"><svg class="logoIcon" viewBox="0 0 256 256" aria-hidden="true"><defs><clipPath id="hlT"><rect x="4" y="4" width="248" height="248" rx="56"/></clipPath><radialGradient id="hlG" cx="50%" cy="34%" r="60%"><stop offset="0" stop-color="#3a2a1c"/><stop offset="1" stop-color="#16110d"/></radialGradient><linearGradient id="hlW" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#5c3319"/><stop offset="0.5" stop-color="#7c4a26"/><stop offset="1" stop-color="#4e2a14"/></linearGradient><linearGradient id="hlS" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#8a5a33"/><stop offset="1" stop-color="#4a2914"/></linearGradient></defs><g clip-path="url(#hlT)"><rect x="4" y="4" width="248" height="248" fill="url(#hlG)"/><rect x="40" y="26" width="176" height="14" rx="3" fill="#86532c"/><rect x="40" y="38" width="176" height="3" fill="#3a2010" opacity="0.6"/><rect x="48" y="40" width="160" height="120" fill="url(#hlW)"/><rect x="62" y="52" width="132" height="76" rx="3" fill="#0e0a08"/><rect x="124" y="86" width="8" height="42" fill="#3a2a1c"/><path d="M128 80 L100 77 L86 72 L86 96 L100 91 L128 88 Z" fill="#4a3a2a"/><path d="M128 79 L162 74 L178 64 L184 64 L184 104 L178 104 L162 94 L128 89 Z" fill="#f2c879"/><rect x="120" y="76" width="16" height="16" rx="3" fill="#b8913f"/><rect x="62" y="55" width="132" height="7" fill="url(#hlS)"/><rect x="62" y="67" width="132" height="7" fill="url(#hlS)"/><rect x="62" y="79" width="132" height="7" fill="url(#hlS)"/><rect x="62" y="91" width="132" height="7" fill="url(#hlS)"/><rect x="62" y="103" width="132" height="7" fill="url(#hlS)"/><rect x="62" y="115" width="132" height="7" fill="url(#hlS)"/><rect x="62" y="52" width="132" height="76" rx="3" fill="none" stroke="#2e180a" stroke-width="3"/><rect x="4" y="150" width="248" height="20" fill="#1c1410"/><rect x="4" y="150" width="248" height="3" fill="#f2c879" opacity="0.85"/><rect x="26.5" y="160" width="7" height="60" fill="#d9ccb4"/>
<rect x="20.5" y="220" width="19" height="24" rx="5" fill="#a8662f" stroke="#7a4519" stroke-width="1.5"/>
<rect x="51.0" y="160" width="7" height="60" fill="#d9ccb4"/>
<rect x="45.0" y="220" width="19" height="24" rx="5" fill="#a8662f" stroke="#7a4519" stroke-width="1.5"/>
<rect x="75.5" y="160" width="7" height="60" fill="#d9ccb4"/>
<rect x="69.5" y="220" width="19" height="24" rx="5" fill="#efe6d2" stroke="#b9ab92" stroke-width="1.5"/>
<rect x="100.0" y="160" width="7" height="46" fill="#d9ccb4"/>
<rect x="94.0" y="206" width="19" height="24" rx="5" fill="#efe6d2" stroke="#b9ab92" stroke-width="1.5"/>
<rect x="124.5" y="160" width="7" height="4" fill="#d9ccb4"/>
<rect x="118.5" y="164" width="19" height="24" rx="5" fill="#26201b" stroke="#8a7a64" stroke-width="1.5"/>
<rect x="149.0" y="160" width="7" height="4" fill="#d9ccb4"/>
<rect x="143.0" y="164" width="19" height="24" rx="5" fill="#efe6d2" stroke="#b9ab92" stroke-width="1.5"/>
<rect x="173.5" y="160" width="7" height="25" fill="#d9ccb4"/>
<rect x="167.5" y="185" width="19" height="24" rx="5" fill="#26201b" stroke="#8a7a64" stroke-width="1.5"/>
<rect x="198.0" y="160" width="7" height="4" fill="#d9ccb4"/>
<rect x="192.0" y="164" width="19" height="24" rx="5" fill="#26201b" stroke="#8a7a64" stroke-width="1.5"/>
<rect x="222.5" y="160" width="7" height="32" fill="#d9ccb4"/>
<rect x="216.5" y="192" width="19" height="24" rx="5" fill="#efe6d2" stroke="#b9ab92" stroke-width="1.5"/></g><rect x="4" y="4" width="248" height="248" rx="56" fill="none" stroke="#3a2f25" stroke-width="2"/></svg><span>Wheelhouse</span></div>
    <select id="preset" class="sel" style="width: 205px" aria-label="Preset"></select>
    <nav class="tabs" id="tabs" aria-label="Sections"></nav>
    <div style="flex: 1"></div>
    <div class="oseg" id="modeSeg" aria-label="Mode: listener in the room or microphones" data-tip="Listener: you stand in the room and hear it on your speakers.
Mics: close mics and a room pair through the mixer, like in the studio."></div>
    <div class="oseg" id="outSeg" aria-label="Output format" data-tip="Output format: the room is rendered for this speaker layout."></div>
    <div class="meters" id="meters" aria-label="Output levels" data-tip="Output level per channel (peak hold, red = above −1 dBFS)."></div>
    <span class="cpu" data-tip="Audio CPU load of the standalone app.">CPU <b id="cpu" class="num">–</b></span>
    <button type="button" class="btn big" id="panic" data-tip="All notes off and reset (MIDI CC 123). Shortcut: Esc.">Panic</button>
  </header>

  <!-- ============ Cabinet: Rotary, organ, room panels ============ -->
  <section class="case wood">
    <div class="play">

      <!-- Rotary panel (SVG cabinet, speed buttons) -->
      <div class="panel lesP">
        <div class="ph"><span>Rotary</span><span id="lesModel" style="font-size: 12px; letter-spacing: 1px; color: #a8977c">Model 122</span></div>
        <div style="display: flex; gap: 16px; align-items: stretch">
          <svg width="140" height="200" viewBox="0 0 140 200" role="img" aria-label="Rotary cabinet with open front" data-tip="Live view of horn and drum." style="flex: none; display: block">
            <defs>
              <linearGradient id="lw" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#3b1f0d"/><stop offset="0.12" stop-color="#6e3d1d"/><stop offset="0.5" stop-color="#7c4724"/><stop offset="0.88" stop-color="#6a3a1b"/><stop offset="1" stop-color="#341b0b"/></linearGradient>
              <linearGradient id="lcap" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#8a5430"/><stop offset="1" stop-color="#4a2611"/></linearGradient>
              <linearGradient id="lcav" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#0d0805"/><stop offset="1" stop-color="#1c110a"/></linearGradient>
              <linearGradient id="ldrum" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#1a110a"/><stop offset="0.35" stop-color="#4a3322"/><stop offset="0.55" stop-color="#5a3f2a"/><stop offset="1" stop-color="#140c07"/></linearGradient>
              <linearGradient id="lbell" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#7d6a52"/><stop offset="0.5" stop-color="#cdb894"/><stop offset="1" stop-color="#7d6a52"/></linearGradient>
              <linearGradient id="lslat" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#8b5530"/><stop offset="0.6" stop-color="#5e3218"/><stop offset="1" stop-color="#2e170a"/></linearGradient>
            </defs>
            <rect x="6" y="10" width="128" height="178" rx="3" fill="url(#lw)"/>
            <rect x="2" y="4" width="136" height="9" rx="2.5" fill="url(#lcap)"/>
            <rect x="2" y="12" width="136" height="1.5" fill="#1d0e05" opacity="0.7"/>
            <rect x="14" y="20" width="112" height="54" rx="2" fill="url(#lcav)"/>
            <ellipse id="orbit" cx="70" cy="44" rx="44" ry="7" fill="none" stroke="#f2a33a" stroke-width="1" stroke-dasharray="2 3" opacity="0.25"/>
            <g id="hornBackG"><path id="hbNeck" fill="#2a1d12"/><ellipse id="hbBell" cy="44" ry="10" fill="#1d140c" stroke="#3a2a1b" stroke-width="1"/></g>
            <rect x="64" y="44" width="12" height="26" rx="2" fill="#1a1612"/>
            <rect x="60" y="66" width="20" height="6" rx="1.5" fill="#2a2420"/>
            <circle cx="70" cy="44" r="5" fill="#3a332c" stroke="#5a5047" stroke-width="1"/>
            <g id="hornFrontG"><path id="hfNeck" fill="url(#lbell)"/><ellipse id="hfBell" cy="44" ry="12" fill="#f2c879" stroke="#a88a55" stroke-width="1.2"/><ellipse id="hfIn" cy="44" ry="7.5" fill="#2a1d0e"/></g>
            <g id="slatsTop"></g>
            <rect x="12" y="19" width="116" height="56" rx="2" fill="none" stroke="#2a1508" stroke-width="2"/>
            <rect x="10" y="78" width="120" height="20" rx="1.5" fill="url(#lw)"/>
            <rect x="10" y="78" width="120" height="1.5" fill="#2a1508" opacity="0.8"/>
            <rect x="10" y="96.5" width="120" height="1.5" fill="#2a1508" opacity="0.8"/>
            <rect x="56" y="84" width="28" height="8" rx="1.5" fill="#c9a45e" stroke="#7a5a26" stroke-width="0.8"/>
            <rect x="59" y="87" width="22" height="2" rx="1" fill="#8a6a30" opacity="0.8"/>
            <rect x="14" y="102" width="112" height="68" rx="2" fill="url(#lcav)"/>
            <rect x="24" y="108" width="92" height="56" rx="4" fill="url(#ldrum)"/>
            <ellipse cx="70" cy="108" rx="46" ry="5" fill="#5a3f2a" stroke="#2a1a10" stroke-width="1"/>
            <g id="drumWin"><rect id="dwRect" y="114" height="44" rx="2" fill="#0a0604" stroke="#f2a33a" stroke-width="1.2" opacity="0.95"/><path id="dwBaffle" stroke="#7a5a3c" stroke-width="2" fill="none"/></g>
            <ellipse cx="70" cy="164" rx="46" ry="4" fill="#120b06"/>
            <g id="slatsBot"></g>
            <rect x="12" y="101" width="116" height="70" rx="2" fill="none" stroke="#2a1508" stroke-width="2"/>
            <rect x="6" y="174" width="128" height="14" rx="1.5" fill="#3a1d0c"/>
            <rect x="6" y="174" width="128" height="1.5" fill="#8a5430" opacity="0.6"/>
            <rect x="12" y="188" width="14" height="6" rx="1.5" fill="#1a0e06"/>
            <rect x="114" y="188" width="14" height="6" rx="1.5" fill="#1a0e06"/>
            <rect x="6" y="10" width="2" height="178" fill="#a86a3c" opacity="0.35"/>
          </svg>
          <div style="flex: 1; display: flex; flex-direction: column; gap: 10px; justify-content: space-between">
            <div class="rpm"><span class="l">Horn</span><span class="v"><span id="hornRpm">0</span><small> rpm</small></span></div>
            <div class="rpm"><span class="l">Drum</span><span class="v"><span id="drumRpm">0</span><small> rpm</small></span></div>
            <div style="font-size: 12.5px; color: #a8977c; line-height: 1.35" id="lesHint">Space bar or mod wheel toggles speed</div>
          </div>
        </div>
        <div class="speed" id="speed" aria-label="Rotary speed"></div>
      </div>

      <!-- Organ panel (drawbars, front knobs, tablets) -->
      <div class="panel orgP">
        <div class="dbgroups" id="dbgroups"></div>
        <div class="front">
          <div id="frontKnobs" style="display: flex; gap: 18px; align-items: flex-end"></div>
          <div class="vsep"></div>
          <div class="tablets" id="tablets" aria-label="Percussion and vibrato"></div>
        </div>
      </div>

      <!-- Room panel (small floor plan, room presets) -->
      <div class="panel roomP">
        <div class="ph"><span>Room</span><button type="button" class="linkbtn" id="openRoom" data-tip="Room settings: size, surfaces, reflections, circus tent.">Settings ›</button></div>
        <div class="rview"><canvas id="roomS" data-tip="Floor plan. Drag the Rotary or your head · right-drag: facing · scroll: rotate."></canvas><div class="rinfo" id="rinfoS"></div></div>
        <div class="rpre" id="roomPre"></div>
      </div>
    </div>

    <!-- Fold-out settings card (pages are built by JS) -->
    <div class="card" id="card" hidden>
      <div class="hinge"></div>
      <div class="chead">
        <span class="ct" id="cTitle"></span><span class="cs" id="cSub"></span>
        <div style="flex: 1"></div>
        <button type="button" class="btn" id="cReset" data-tip="Reset everything on this page to its defaults.">Reset</button>
        <button type="button" class="btn primary" id="cClose">Back to Play</button>
      </div>
      <div class="cbody" id="cbody">
        <div class="bigroom" id="bigRoom" hidden>
          <div class="rview"><canvas id="roomB" data-tip="Floor plan. Drag the Rotary or your head (or the mics) · right-drag: facing · scroll: rotate."></canvas><div class="rhint">Floor plan · Drag: Rotary / head · Right-drag: facing · Scroll: rotate</div></div>
          <div class="rstats">
            <span data-tip="Reverb time (Eyring) in the low, mid and high band.">RT60 low / mid / high <b id="stRt">–</b></span>
            <span data-tip="Critical distance: here direct sound and room are equally loud.">Critical distance <b id="stRc">–</b></span>
            <span data-tip="Number of rendered sound paths (direct + image sources).">Paths <b id="stPaths">–</b></span>
            <span>CPU <b id="stCpu">–</b></span>
          </div>
        </div>
      </div>
    </div>
  </section>

  <!-- ============ Manuals + pedalboard ============ -->
  <section class="keys wood">
    <div class="kstrip">
      <span style="display: flex; align-items: center; gap: 8px" data-tip="Swell (expression) pedal position.">Swell <span class="swbar"><i id="swBar"></i></span></span>
      <span id="chanInfo"></span>
      <span class="splitg" id="splitG"></span>
      <div style="flex: 1"></div>
      <span id="midiInfo">MIDI –</span>
      <span style="display: flex; align-items: center; gap: 8px" data-tip="Which manual the computer keyboard plays (Z–M and Q–P rows).">QWERTY <span class="pcseg" id="pcSeg"></span></span>
      <span style="display: flex; align-items: center; gap: 8px" data-tip="Octave of the computer keyboard.">Octave
        <button type="button" class="octb" id="octDn" aria-label="Octave down">−</button>
        <span id="octV" class="hi" style="min-width: 14px; text-align: center">0</span>
        <button type="button" class="octb" id="octUp" aria-label="Octave up">+</button>
      </span>
    </div>
    <div class="manual"><div class="felt"></div><div class="mrow"><span class="vlab">Upper</span><div class="kbd" id="kbd0"></div><div class="octv" id="ov0"></div></div></div>
    <div class="manual" style="margin-top: 6px"><div class="felt"></div><div class="mrow"><span class="vlab">Lower</span><div class="kbd" id="kbd1"></div><div class="octv" id="ov1"></div></div></div>
    <div class="pedrow">
      <span class="vlab">Pedal</span>
      <svg id="pedSvg" width="710" height="86" viewBox="0 0 760 92" role="img" aria-label="25-note pedalboard" data-tip="25-note pedalboard: click to play, or use the pedal MIDI channel.">
        <defs>
          <linearGradient id="pedWood" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#8f7448"/><stop offset="0.18" stop-color="#d9c398"/><stop offset="0.5" stop-color="#e8d7b0"/><stop offset="0.82" stop-color="#d2bb8e"/><stop offset="1" stop-color="#86693e"/></linearGradient>
          <linearGradient id="pedOn" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#9a6520"/><stop offset="0.5" stop-color="#f2b257"/><stop offset="1" stop-color="#9a6520"/></linearGradient>
          <linearGradient id="pedSharp" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#0c0a09"/><stop offset="0.35" stop-color="#3a342e"/><stop offset="0.65" stop-color="#2a2521"/><stop offset="1" stop-color="#0c0a09"/></linearGradient>
          <linearGradient id="pedSharpOn" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#5a3a10"/><stop offset="0.5" stop-color="#b5731e"/><stop offset="1" stop-color="#5a3a10"/></linearGradient>
          <linearGradient id="pedRail" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#5a321b"/><stop offset="1" stop-color="#2e170a"/></linearGradient>
          <linearGradient id="pedGrain" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#000" stop-opacity="0.18"/><stop offset="0.3" stop-color="#000" stop-opacity="0"/><stop offset="1" stop-color="#000" stop-opacity="0.06"/></linearGradient>
        </defs>
        <rect x="22" y="4" width="716" height="86" rx="3" fill="#140a04"/>
        <rect x="22" y="0" width="716" height="9" rx="2" fill="url(#pedRail)"/>
        <g id="pedKeys"></g>
      </svg>
      <svg id="swellSvg" width="60" height="86" viewBox="0 0 64 92" role="slider" aria-label="Swell pedal" data-tip="Swell pedal: drag or scroll." style="cursor: ns-resize">
        <path d="M10 4 L54 4 L60 86 L4 86 Z" fill="#1a1512" stroke="#3a312a" stroke-width="1.2"/>
        <path d="M14 10 L50 10 L54 78 L10 78 Z" fill="#26201c"/>
        <path d="M16 16 L48 16 M15 24 L49 24 M15 32 L49 32 M14 40 L50 40 M13 48 L51 48 M13 56 L51 56 M12 64 L52 64 M12 72 L52 72" stroke="#3e352e" stroke-width="3" stroke-linecap="round"/>
        <rect x="4" y="86" width="56" height="5" rx="1.5" fill="#0d0a08"/>
        <rect x="58" y="18" width="4" height="62" rx="2" fill="#120f0c"/>
        <rect id="swFill" x="58" y="34" width="4" height="46" rx="2" fill="#f2a33a"/>
      </svg>
      <div class="octv" id="ov2"></div>
      <span style="width: 22px; flex: none"></span>
    </div>
  </section>
</div>

<script type="text/plain" id="tracer-src">
/*TRACER*/
</script>

</body>
</html>
